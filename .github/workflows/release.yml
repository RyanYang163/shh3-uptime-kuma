name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      platform:
        description: "目标架构（Deb 应用用）"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: write

env:
  # 上游版本锁定 —— 升级时改这里，不要用 floating 分支
  UPSTREAM_REPO: ""
  UPSTREAM_TAG: ""
  # 产物是纯静态前端（true）还是自带二进制（false）
  BUILD_FROM_UPSTREAM: "none"
  # 镜像漏洞基线：允许的「有官方修复的 HIGH/CRITICAL」上限（回归门禁，非「必须为 0」）
  #
  # 为什么不是 0：本应用的 HIGH/CRITICAL 全部位于**上游官方镜像内部** ——
  # uptime-kuma 捆绑的 cloudflared、extra/healthcheck（Go 二进制）与 Debian 基础层。
  # 本仓库不含任何镜像层，换 tag / 改封装都无法消除。
  # 平台口径（开发者审核表 V2.3）中 T1「无已知高危 CVE」属**挂起 + 豁免通道**，
  # 不是驳回项（红线仅 V4 恶意代码 / V12 违法内容），故此处不阻断发版，
  # 但把实测数字写进随包附上的 trivy-summary.txt，供审核与豁免申请引用。
  # 实测基线（trivy 0.74.0，DB 2026-09-21）：可修复 118 / 总 225
  TRIVY_MAX_FIXABLE: "130"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: meta
        run: |
          set -euo pipefail
          APPID=$(python3 -c "import json;print(json.load(open('config.ini'))['id'])")
          VER=$(python3 -c "import json;print(json.load(open('config.ini'))['version'])")
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 指引 10.2 Step 3：tag 与 config.ini 的 version 必须完全一致（前缀 v 可选）
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::tag(${TAG}) 与 config.ini 的 version(${VER}) 不一致，平台会拒绝"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: 守卫 —— 已存在的 Release 一律拒绝覆盖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 坑 11：重新构建会改变 deb 内嵌时间戳 → sha256 变化 → 平台 checksum mismatch
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。禁止覆盖 —— 覆盖会改变资产哈希，导致平台校验失败。请改用新的版本号。"
            exit 1
          fi
          echo "Release $TAG 尚不存在，可以继续。"

      - name: 镜像漏洞扫描（审核项 T1 / S10）
        run: |
          set -euo pipefail
          IMG=$(grep -m1 '^ *image:' docker-compose.yml | sed 's/.*image: *//' | tr -d '"')
          echo "扫描镜像：$IMG"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh             | sudo sh -s -- -b /usr/local/bin
          trivy --version

          count() { python3 -c "
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print(0); raise SystemExit
          print(sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results',[])))
          " "$1"; }

          # ① 全部 HIGH/CRITICAL（含上游已停止修复的）
          trivy image --severity HIGH,CRITICAL --no-progress             --format json -o trivy-report.json "$IMG" || true
          trivy image --severity HIGH,CRITICAL --no-progress             --format table -o trivy-report.txt "$IMG" || true
          [ -f trivy-report.txt ] || echo "（trivy 未产出报告）" > trivy-report.txt
          TOTAL=$(count trivy-report.json)

          # ② 仅统计「有官方修复版本」的（标准门禁口径）
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress             --format json -o trivy-fixable.json "$IMG" || true
          FIXABLE=$(count trivy-fixable.json)

          {
            echo "镜像: $IMG"
            echo "HIGH/CRITICAL 总数        : $TOTAL"
            echo "其中「存在官方修复」的    : $FIXABLE"
            echo "其中「上游尚无修复」的    : $((TOTAL - FIXABLE))"
            echo "本项目声明的可修复数基线  : $TRIVY_MAX_FIXABLE"
            echo ""
            echo "门禁口径：回归门禁 —— 可修复的 HIGH/CRITICAL 不得超过基线 $TRIVY_MAX_FIXABLE。"
            echo "上述漏洞全部位于上游官方镜像内部（捆绑的 cloudflared / extra/healthcheck /"
            echo "Debian 基础层），本仓库不含任何镜像层，改封装无法消除。"
            echo "按开发者审核表 V2.3，T1「无已知高危 CVE」属挂起 + 豁免通道，非驳回项。"
            echo "「上游尚无修复」的漏洞任何镜像都无法消除，不作为拒绝依据。"
            echo ""
            cat trivy-report.txt
          } > trivy-summary.txt

          echo "HIGH/CRITICAL 总数=$TOTAL  可修复=$FIXABLE  基线=$TRIVY_MAX_FIXABLE"
          if [ "$FIXABLE" -gt "$TRIVY_MAX_FIXABLE" ]; then
            echo "::error::可修复 HIGH/CRITICAL 由基线 $TRIVY_MAX_FIXABLE 上升到 $FIXABLE，疑为镜像上游回归，请复核后再发版。"
            grep -E "^[a-z0-9.-]+ +[A-Z0-9-]+ +v?[0-9]" trivy-report.txt | head -20 || true
            exit 1
          fi
          if [ "$FIXABLE" -gt 0 ]; then
            echo "::warning::存在 $FIXABLE 个「有官方修复的」HIGH/CRITICAL，全部位于上游镜像内部，已按声明基线 $TRIVY_MAX_FIXABLE 放行；trivy-summary.txt 随 Release 附上供豁免申请引用。"
          fi

      - name: 构建 Docker 应用包
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh

      - name: 检查构建产物
        id: asset
        run: |
          set -euo pipefail
          APPID="${{ steps.meta.outputs.appid }}"
          TGZ="build/output/${APPID}.tar.gz"
          [ -f "$TGZ" ] || { echo "::error::未找到 $TGZ"; exit 1; }
          [ -f "${TGZ}.sha256" ] || { echo "::error::缺少 ${TGZ}.sha256 伴随文件"; exit 1; }
          # 指引 6.2：归档根层恰好 4 个文件（漏洞报告是独立资产，不计入包内）
          N=$(tar -tzf "$TGZ" | grep -c '[^/]$')
          if [ "$N" -ne 4 ]; then
            echo "::error::归档根层文件数为 ${N}，必须恰好为 4"
            exit 1
          fi
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.asset.outputs.tgz }}" \
            "${{ steps.asset.outputs.tgz }}.sha256" \
            trivy-summary.txt \
            trivy-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.appid }} ${{ steps.meta.outputs.version }}" \
            --notes "TOS 7 Docker 应用包。需先在 TOS 应用中心安装并启用 DockerEngine。

          附镜像漏洞扫描（trivy）：
          - \`trivy-summary.txt\` —— 计数与已声明的可修复数基线
          - \`trivy-report.txt\`  —— 完整 HIGH/CRITICAL 清单

          这些漏洞全部位于上游发布的镜像内部（捆绑的 cloudflared / extra/healthcheck /
          Debian 基础层 / Node 依赖），本仓库不含任何镜像层，改封装无法消除。
          按开发者审核表 V2.3，T1「无已知高危 CVE」属挂起 + 豁免通道，非驳回项。"
