services:
  shh3-uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: shh3-uptime-kuma
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18803:3001"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh3-uptime-kuma/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

x-app-meta:
  web:
    port: 18803
    protocol: http
