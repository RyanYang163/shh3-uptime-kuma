version: "3.8"

services:
  shh3-uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: shh3-uptime-kuma
    restart: unless-stopped
    ports:
      - "18803:3001"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh3-uptime-kuma/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "500m"
          memory: 512M

x-app-meta:
  web:
    port: 18803
    protocol: http
